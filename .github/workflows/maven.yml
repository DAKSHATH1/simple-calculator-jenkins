name: Maven Build and Docker Publish

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  # JOB 1: BUILD AND TEST
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify Java and Maven
        run: |
          java -version
          mvn -version

      - name: Build and Test Application
        run: mvn clean verify

      - name: Upload Application JAR
        uses: actions/upload-artifact@v7
        with:
          name: application-jar
          path: target/application-0.0.1-SNAPSHOT.jar
          if-no-files-found: error


  # JOB 2: PUSH TO DOCKER HUB
  push-to-docker-hub:
    name: Push to Docker Hub
    needs: build-and-test
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Download Application JAR
        uses: actions/download-artifact@v8
        with:
          name: application-jar
          path: target/

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/lab-application:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/lab-application:${{ github.sha }}
